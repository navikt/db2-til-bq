tables:
- name: v_saldo_detalj
  table_type: fak
  description: Summert debet og kredit for posteringer i UR fordelt på konto.
  check_col: sist_oppdatert
  order_cols: 
    - dato_postert_ur
  cols:
    - name: dato_postert_ur
      col_data_type: date
      description: Datoen posteringen ble gjort i UR.
      mode: required

    - name: hovedkontonr
      col_data_type: string
      description: Hovedkontonummeret i UR.
      max_length: 3 
      mode: required

    - name: underkontonr
      col_data_type: string
      description: Underkontonummeret i UR.
      max_length: 4
      mode: required

    - name: kode_oppdrag_num
      col_data_type: integer
      description: Koden for oppdrag.
      mode: required

    - name: antall_mottakere
      col_data_type: integer
      description: Antall mottakere.

    - name: sum_debet
      col_data_type: string
      description: Summen av debet for posteringene i UR.

    - name: sum_kredit
      col_data_type: string
      description: Summen av kredit for posteringene i UR.

    - name: registrert
      col_data_type: datetime
      description: Tidspunktet for når raden ble registrert i UR.
      mode: required
      
    - name: sist_oppdatert
      col_data_type: datetime
      description: Tidspunktet for når raden sist ble oppdatert i UR.
      mode: required

- name: v_saldo_avregn
  table_type: fak
  description: Avregnet saldo i UR fordelt på konto.
  check_col: sist_oppdatert
  order_cols: 
    - dato_valutert_ur
  cols:
    - name: dato_valutert_ur
      col_data_type: date
      description: Datoen saldoen var valutert.
      mode: required

    - name: hovedkontonr
      col_data_type: string
      description: Hovedkontonummeret i UR.
      max_length: 3 
      mode: required

    - name: underkontonr
      col_data_type: string
      description: Underkontonummeret i UR.
      max_length: 4
      mode: required

    - name: antall_mottakere
      col_data_type: integer
      description: Antall mottakere.

    - name: sum_debet
      col_data_type: string
      description: Summen av debet for posteringene i UR.

    - name: sum_kredit
      col_data_type: string
      description: Summen av kredit for posteringene i UR.

    - name: registrert
      col_data_type: datetime
      description: Tidspunktet for når raden ble registrert i UR.
      mode: required
      
    - name: sist_oppdatert
      col_data_type: datetime
      description: Tidspunktet for når raden sist ble oppdatert i UR.
      mode: required

- name: v_kontoplan
  table_type: dim
  description: Oversikt over kontoer som brukes i UR.
  cols: 
    - name: hovedkontonr
      col_data_type: string
      description: Hovedkontonummeret i UR.
      max_length: 3 
      mode: required

    - name: underkontonr
      col_data_type: string
      description: Underkontonummeret i UR.
      max_length: 4
      mode: required

    - name: oebs_artskonto
      col_data_type: string
      description: Kobling til regnskapet i OEBS. (Ikke alltid utfylt, kan mangle.)
      max_length: 12

    - name: kontonavn_oebs
      col_data_type: string
      description: Tilhørende kontnavn i OEBS. (Ikke alltid utfylt, kan mangle.)
      max_length: 50

    - name: bevilgningskonto
      col_data_type: string
      description: . (Ikke alltid utfylt, kan mangle.)
      max_length: 12

    - name: hovedkonto_navn
      col_data_type: string
      description: Navnet på tilhørende hovedkonto.
      max_length: 70

    - name: underkonto_navn_nb
      col_data_type: string
      description: Navnet på tilhørende underkonto.
      max_length: 70

    - name: kode_uttrekk
      col_data_type: string
      description: .
      max_length: 20

    - name: ray_fom
      col_data_type: date
      description: viser om det er en ytelse som skal til RAY.

    - name: lopenr
      col_data_type: integer
      description: Må alltid settes til 9999 ved spørringer (annet løpenr er historikk/feil).

- name: v_oppdragskode
  table_type: dim
  description: Sammenkobling fra UR til Oppdragssystemet.
  cols: 
    - name: kode_oppdrag_num
      col_data_type: integer
      description: Nøkkel til Kode for oppdrag.
      mode: required

    - name: kode_oppdrag
      col_data_type: string
      description: Kode for oppdrag, eks 'GS' (for oppdragsnavnet 'Gravferdsstønad')
      mode: required
      max_length: 7

    - name: oppdragsnavn
      col_data_type: string
      description: Oppdragsnavnet som tilhører oppdrag kode, eks 'Gravferdsstønad' for kode 'GS'.
      mode: required
      max_length: 50
