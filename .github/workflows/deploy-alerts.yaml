name: Deploy alerts

on: [push]

jobs:
    deploy:
        name: Deploy to dev and prod
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
            actions: read

        steps:
            - name: Check out repository code
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Deploy to DEV
              uses: nais/deploy/actions/deploy@2d18f050f07b6a007864c6a57070ed915d571beb # v2
              env:
                  CLUSTER: "dev-fss"
                  RESOURCE: .nais/alert.yaml
            - name: Deploy to PROD
              uses: nais/deploy/actions/deploy@2d18f050f07b6a007864c6a57070ed915d571beb # v2
              env:
                  CLUSTER: "prod-fss"
                  RESOURCE: .nais/alert.yaml
