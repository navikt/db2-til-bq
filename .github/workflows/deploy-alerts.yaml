name: Deploy alerts

on: [push]

jobs:
    deploy:
        name: Deploy to dev and prod
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
            actions: read

        steps:
            - name: Check out repository code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Deploy to DEV
              uses: nais/deploy/actions/deploy@1de80da70ad26556ecdc5964a8b7ec3bbed98120 # v2
              env:
                  CLUSTER: "dev-fss"
                  RESOURCE: .nais/alert.yaml
            - name: Deploy to PROD
              uses: nais/deploy/actions/deploy@1de80da70ad26556ecdc5964a8b7ec3bbed98120 # v2
              env:
                  CLUSTER: "prod-fss"
                  RESOURCE: .nais/alert.yaml
