name: Deploy alerts

on: [push]

jobs:
    deploy:
        name: Deploy to dev and prod
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
            actions: read

        steps:
            - name: Check out repository code
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - name: Deploy to DEV
              uses: nais/deploy/actions/deploy@2d18f050f07b6a007864c6a57070ed915d571beb # v2
              env:
                  CLUSTER: "dev-fss"
                  RESOURCE: .nais/alert.yaml
            - name: Deploy to PROD
              uses: nais/deploy/actions/deploy@2d18f050f07b6a007864c6a57070ed915d571beb # v2
              env:
                  CLUSTER: "prod-fss"
                  RESOURCE: .nais/alert.yaml
